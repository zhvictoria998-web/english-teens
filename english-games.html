<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English games</title>
<style>
:root{
  --bg:#E6F3EE; --panel:#FFFDF5; --ink:#1F2A37; --muted:#5C6B7A;
  --tile:#FFD55A; --tile-edge:#D9A514; --slot:#B9CBC4;
  --red:#D1342F; --blue:#2A6FDB; --ok:#2E9E5B; --ok-bg:#DFF5E6; --bad:#D1342F; --bad-bg:#FBE3E1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Lexend","Verdana","Trebuchet MS",sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:14px 12px 32px;
}
button{font:inherit; color:inherit}
button:focus-visible{outline:4px solid var(--blue); outline-offset:3px}
.top{width:100%; max-width:760px; display:flex; align-items:center; gap:12px; min-height:48px}
.home{border:0; background:var(--panel); width:48px; height:48px; border-radius:50%; font-size:22px; cursor:pointer; flex:none}
.stars{display:flex; flex-wrap:wrap; gap:3px; font-size:19px; line-height:1; flex:1}
.stars span{opacity:.22; filter:grayscale(1)}
.stars span.on{opacity:1; filter:none}
.stars span.miss{opacity:.55}
.stars span.now{opacity:.6; outline:2px solid var(--blue); border-radius:50%}
.hardopt{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
.hardopt input{width:20px; height:20px; accent-color:var(--blue)}

main{width:100%; max-width:760px; margin-top:12px; background:var(--panel); border-radius:28px; padding:24px 16px 28px; text-align:center}
section{display:none}
section.on{display:block}

/* menu */
h1{font-size:30px; font-weight:600; margin:4px 0 4px}
.sub{color:var(--muted); font-size:15px; margin:0 0 20px}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; text-align:left}
.mode{
  border:0; background:var(--bg); border-radius:20px; padding:16px; cursor:pointer;
  display:flex; gap:14px; align-items:center; text-align:left;
}
.mode:disabled{opacity:.4; cursor:not-allowed}
.mode .ic{font-size:40px; line-height:1; flex:none}
.mode b{display:block; font-size:19px; font-weight:600}
.mode small{display:block; color:var(--muted); font-size:13.5px; margin-top:3px; line-height:1.35}
.warn{background:var(--bad-bg); color:var(--bad); border-radius:14px; padding:10px 14px; font-size:14px; margin-bottom:16px; display:none}
.setgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.setbtn{border:0; background:var(--tile); box-shadow:0 5px 0 var(--tile-edge); border-radius:18px; padding:16px 10px; cursor:pointer}
.setbtn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--tile-edge)}
.setbtn b{display:block; font-size:26px; font-weight:600; letter-spacing:1px}
.setbtn small{display:block; font-size:14px; margin-top:4px; opacity:.75}
.setbtn.mix{background:var(--blue); color:#fff; box-shadow:0 5px 0 #1B4C9C}

/* play */
.pic{
  width:min(44vw,200px); height:min(44vw,200px); margin:0 auto 6px;
  display:flex; align-items:center; justify-content:center; font-size:min(29vw,124px); line-height:1;
}
.pic svg{width:100%; height:100%}
.num{display:flex; flex-direction:column; align-items:center; gap:10px}
.num b{font-size:.85em; font-weight:600; color:var(--blue); line-height:1}
.dots{display:grid; grid-template-columns:repeat(5,.13em); gap:.05em}
.dots i{width:.13em; height:.13em; border-radius:50%; background:var(--red)}
.say{border:0; background:var(--bg); font-size:26px; width:56px; height:56px; border-radius:50%; cursor:pointer; margin:4px 0 16px}
.say.big{width:120px; height:120px; font-size:56px; margin:10px 0 26px; background:var(--blue); box-shadow:0 6px 0 #1B4C9C}
.say.big:active{transform:translateY(3px); box-shadow:0 3px 0 #1B4C9C}
.row{display:flex; justify-content:center; flex-wrap:wrap; gap:10px}
.slot,.tile,.box{
  width:min(16vw,72px); height:min(18vw,84px); border-radius:14px;
  font-size:min(10vw,46px); display:flex; align-items:center; justify-content:center; padding:0;
}
.slot{border:3px dashed var(--slot); background:transparent; cursor:pointer}
.slot.full{border-style:solid; border-color:var(--tile-edge); background:var(--tile)}
.slots{margin-bottom:30px; min-height:min(18vw,84px)}
.ok .slot,.ok .box{border-color:var(--ok)!important; background:var(--ok-bg)!important; cursor:default}
.v{color:var(--red)} .e{color:var(--blue)}
.shake{animation:shake .45s}
.slot.wrong{border-color:var(--bad)}
.tile{border:0; background:var(--tile); box-shadow:0 5px 0 var(--tile-edge); cursor:pointer}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 var(--tile-edge)}
.tile.used{visibility:hidden}
.box{border:3px solid var(--slot); background:#fff}
.box.gap{border-style:dashed; color:var(--ok)}
.wordrow{margin-bottom:28px}
.bigword{font-size:min(15vw,72px); letter-spacing:3px; margin:18px 0 30px}

.opts{display:flex; justify-content:center; flex-wrap:wrap; gap:16px}
.optbtn{
  border:3px solid transparent; background:var(--tile); box-shadow:0 5px 0 var(--tile-edge);
  border-radius:18px; cursor:pointer; min-width:min(38vw,170px); padding:14px 18px;
  font-size:min(10vw,44px); letter-spacing:2px;
}
.optbtn.letter{min-width:0; width:min(22vw,96px)}
.optbtn.picopt{background:#fff; box-shadow:0 5px 0 var(--slot); border-color:var(--slot); min-width:0; padding:8px}
.optbtn.picopt .pic{width:min(24vw,130px); height:min(24vw,130px); font-size:min(17vw,84px); margin:0}
.optbtn:active{transform:translateY(3px)}
.optbtn.right{background:var(--ok-bg); border-color:var(--ok); box-shadow:0 5px 0 var(--ok)}
.optbtn.wrongpick{background:var(--bad-bg); border-color:var(--bad); box-shadow:0 5px 0 var(--bad)}
.check{margin-top:4px; border:0; border-radius:18px; background:var(--ok); color:#fff; font-size:22px; font-weight:600; padding:14px 40px; cursor:pointer}
.hint{color:var(--muted); font-size:14px; margin-top:16px; min-height:20px}
.msg{min-height:34px; margin-top:16px; font-size:24px; font-weight:600; color:var(--ok)}
.msg.no{color:var(--bad)}
.next{margin-top:8px; border:0; border-radius:18px; background:var(--blue); color:#fff; font-size:22px; font-weight:600; padding:14px 40px; cursor:pointer; visibility:hidden}
.next.show{visibility:visible}
.endbig{font-size:80px}
.score{font-size:44px; font-weight:600; margin:6px 0 20px}
.endbtns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.endbtns .next{visibility:visible}
.endbtns .ghost{background:var(--bg); color:var(--ink)}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div class="top">
  <button class="home" id="home" title="Меню" aria-label="Menu" style="visibility:hidden">🏠</button>
  <div class="stars" id="stars"></div>
  <label class="hardopt" id="hardwrap" style="display:none"><input type="checkbox" id="hard"> Лишние буквы</label>
</div>

<main>
  <section id="menu" class="on">
    <h1>English games</h1>
    <p class="sub">Выбери игру</p>
    <div class="warn" id="warn">На этом устройстве браузер не умеет озвучивать слова, поэтому игры со звуком отключены. Попробуй открыть файл в Chrome, Edge или Safari.</div>
    <div class="modes">
      <button class="mode" data-mode="build"><span class="ic">🧩</span><span><b>Build the word</b><small>Собери слово из букв по картинке</small></span></button>
      <button class="mode audio" data-mode="listen"><span class="ic">👂</span><span><b>Listen and choose</b><small>Послушай и выбери слово: kit или kite? big или dig?</small></span></button>
      <button class="mode audio" data-mode="missing"><span class="ic">🔤</span><span><b>Missing letter</b><small>Послушай и вставь пропущенную букву: _ig</small></span></button>
      <button class="mode" data-mode="find"><span class="ic">🖼️</span><span><b>Read and find</b><small>Прочитай слово и найди картинку</small></span></button>
    </div>
  </section>

  <section id="sets">
    <h1 id="setsTitle">Listen and choose</h1>
    <p class="sub">Какие звуки тренируем?</p>
    <div class="setgrid" id="setgrid"></div>
  </section>

  <section id="play">
    <div id="stage"></div>
    <div class="hint" id="hint"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="next" id="next">Next</button>
  </section>

  <section id="end">
    <div class="endbig">🏆</div>
    <h1>Well done!</h1>
    <div class="score" id="score"></div>
    <div class="endbtns">
      <button class="next" id="again">Еще раз</button>
      <button class="next ghost" id="tomenu">Меню</button>
    </div>
  </section>
</main>

<script>
/* ---------- data ---------- */
var LIME='<svg viewBox="0 0 200 200"><ellipse cx="100" cy="108" rx="78" ry="66" fill="#7AC943" stroke="#4E9A22" stroke-width="5"/><ellipse cx="20" cy="108" rx="8" ry="11" fill="#4E9A22"/><ellipse cx="180" cy="108" rx="8" ry="11" fill="#4E9A22"/><path d="M60 78c16-16 40-22 62-16" stroke="#C9F29B" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M100 42c6-22 26-32 46-28-4 20-22 32-46 28z" fill="#3E8E2A"/></svg>';
var NAME='<svg viewBox="0 0 200 200"><rect x="14" y="40" width="172" height="120" rx="14" fill="#D1342F"/><rect x="24" y="86" width="152" height="62" rx="6" fill="#fff"/><text x="100" y="64" text-anchor="middle" font-family="Lexend,Verdana,sans-serif" font-size="19" font-weight="600" fill="#fff">HELLO</text><text x="100" y="80" text-anchor="middle" font-family="Lexend,Verdana,sans-serif" font-size="11" fill="#fff">my name is</text><text x="100" y="128" text-anchor="middle" font-family="Lexend,Verdana,sans-serif" font-size="32" fill="#1F2A37">Kate</text></svg>';
function num(n){var d='';for(var i=0;i<n;i++)d+='<i></i>';return '<div class="num"><b>'+n+'</b><div class="dots">'+d+'</div></div>'}
var WORDS=[
  {w:'lime',pic:LIME},{w:'skate',pic:'⛸️'},{w:'kite',pic:'🪁'},{w:'bike',pic:'🚲'},
  {w:'nine',pic:num(9)},{w:'five',pic:num(5)},{w:'six',pic:num(6)},{w:'seven',pic:num(7)},
  {w:'ten',pic:num(10)},{w:'cake',pic:'🎂'},{w:'name',pic:NAME},{w:'time',pic:'⏰'},
  {w:'game',pic:'🎮'},{w:'man',pic:'👨'},{w:'cap',pic:'🧢'}
];
var SETS=[
  {key:'ie', label:'i / i_e', ex:'kit - kite', magic:true, groups:[['kit','kite'],['pin','pine'],['rid','ride'],['fin','fine'],['dim','dime'],['bit','bite'],['hid','hide'],['rip','ripe'],['slid','slide']]},
  {key:'ae', label:'a / a_e', ex:'cap - cape', magic:true, groups:[['cap','cape'],['tap','tape'],['mad','made'],['man','mane'],['hat','hate'],['plan','plane'],['can','cane'],['rat','rate'],['pal','pale']]},
  {key:'aie', label:'a / i / e', ex:'pan - pin - pen', groups:[['pan','pin','pen'],['bag','big','beg'],['ham','him','hem'],['tan','tin','ten'],['pat','pit','pet'],['sat','sit','set'],['bad','bid','bed']]},
  {key:'bd', label:'b / d', ex:'big - dig', groups:[['big','dig'],['bad','dad'],['bug','dug'],['bin','din'],['bid','did'],['bump','dump'],['bark','dark'],['beep','deep']]},
  {key:'ft', label:'f / t', ex:'fin - tin', groups:[['fin','tin'],['fan','tan'],['fell','tell'],['fall','tall'],['file','tile'],['fake','take'],['fame','tame']]},
  {key:'mt', label:'m / t', ex:'map - tap', groups:[['map','tap'],['mop','top'],['men','ten'],['mug','tug'],['make','take'],['mile','tile'],['mime','time'],['man','tan']]},
  {key:'pb', label:'p / b', ex:'pig - big', groups:[['pig','big'],['pin','bin'],['pat','bat'],['pug','bug'],['pet','bet'],['pack','back'],['pad','bad']]}
];
var ROUNDS=10;
var PRAISE=['Yes!','Great!','Super!','Well done!'];

/* ---------- helpers ---------- */
var $=function(id){return document.getElementById(id)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function isMagic(w){return w.length>=4&&w[w.length-1]==='e'&&'ai'.indexOf(w[w.length-3])>=0}
function colorWord(w){
  if(!isMagic(w)) return w;
  var n=w.length;
  return w.slice(0,n-3)+'<span class="v">'+w[n-3]+'</span>'+w[n-2]+'<span class="e">e</span>';
}
function picOf(w){for(var i=0;i<WORDS.length;i++)if(WORDS[i].w===w)return WORDS[i].pic;return ''}

var canSpeak=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
var voice=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[], best=null, score=-1;
    vs.forEach(function(v){
      if(!/^en/i.test(v.lang)) return;
      var s=1;
      if(/en[-_]US/i.test(v.lang)) s+=2; else if(/en[-_]GB/i.test(v.lang)) s+=1;
      if(/google|samantha|natural|aria|jenny/i.test(v.name)) s+=2;
      if(s>score){score=s;best=v}
    });
    voice=best;
  }catch(e){}
}
if(canSpeak){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){} }
function speak(w){
  if(!canSpeak) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(w);
    u.lang=voice?voice.lang:'en-US'; if(voice)u.voice=voice; u.rate=0.7;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- state and navigation ---------- */
var G={mode:null,set:null,items:[],idx:0,results:[],answered:false};
function show(id){
  ['menu','sets','play','end'].forEach(function(s){$(s).classList.toggle('on',s===id)});
  $('home').style.visibility=(id==='menu')?'hidden':'visible';
  $('hardwrap').style.display=(id==='play'&&G.mode==='build')?'flex':'none';
  if(id!=='play'&&id!=='end') $('stars').innerHTML='';
}
function drawStars(){
  var h='';
  for(var i=0;i<G.items.length;i++){
    var c=i<G.idx?(G.results[i]?'on':'miss'):(i===G.idx?'now':'');
    h+='<span class="'+c+'">⭐</span>';
  }
  $('stars').innerHTML=h;
}
function finishRound(right,msg){
  G.answered=true;
  if(G.results[G.idx]===undefined) G.results[G.idx]=right;
  $('msg').className='msg'+(right?'':' no');
  $('msg').textContent=msg||(right?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'');
  $('next').classList.add('show');
  if(right) $('next').focus();
}
function nextRound(){
  G.idx++;
  if(G.idx>=G.items.length){
    drawStars();
    var r=G.results.filter(Boolean).length;
    $('score').textContent=r+' / '+G.items.length;
    show('end'); return;
  }
  startRound();
}
function startRound(){
  G.answered=false;
  $('msg').textContent=''; $('msg').className='msg'; $('hint').textContent='';
  $('next').classList.remove('show');
  drawStars();
  ({build:roundBuild,listen:roundListen,missing:roundMissing,find:roundFind})[G.mode](G.items[G.idx]);
}

/* ---------- building item lists ---------- */
function groupsFor(setKey,filter){
  var out=[];
  SETS.forEach(function(s){
    if(filter&&!filter(s)) return;
    if(setKey==='mix'||s.key===setKey) out=out.concat(s.groups);
  });
  return out;
}
function makeItems(groups){
  var all=[];
  groups.forEach(function(g){g.forEach(function(w,i){all.push({group:g,target:w})})});
  shuffle(all);
  var items=[],last=null;
  while(items.length<ROUNDS&&all.length){
    var k=0; while(k<all.length-1&&all[k].group===last)k++;
    var it=all.splice(k,1)[0]; items.push(it); last=it.group;
  }
  return items;
}
function startGame(mode,setKey){
  G.mode=mode; G.set=setKey; G.idx=0; G.results=[];
  if(mode==='build') G.items=WORDS.slice();
  else if(mode==='find') G.items=shuffle(WORDS.slice()).slice(0,ROUNDS);
  else if(mode==='listen') G.items=makeItems(groupsFor(setKey));
  else if(mode==='missing') G.items=makeItems(groupsFor(setKey,function(s){return !s.magic}));
  show('play'); startRound();
}
function openSets(mode){
  G.mode=mode;
  $('setsTitle').textContent=mode==='listen'?'Listen and choose':'Missing letter';
  var list=SETS.filter(function(s){return mode==='listen'||!s.magic});
  $('setgrid').innerHTML=list.map(function(s){
    return '<button class="setbtn" data-set="'+s.key+'"><b>'+s.label+'</b><small>'+s.ex+'</small></button>';
  }).join('')+'<button class="setbtn mix" data-set="mix"><b>Mix</b><small>все вперемешку</small></button>';
  show('sets');
}

/* ---------- mode: build the word ---------- */
var B={slots:[],tiles:[],locked:false};
function roundBuild(item){
  var w=item.w, letters=w.split('');
  if($('hard').checked){
    var pool=shuffle('bdfghlmnoprstu'.split('').filter(function(c){return w.indexOf(c)<0}));
    letters=letters.concat(pool.slice(0,2));
  }
  do{shuffle(letters)}while(letters.slice(0,w.length).join('')===w);
  B.tiles=letters.map(function(c){return {ch:c,used:false}});
  B.slots=w.split('').map(function(){return null});
  B.locked=false;
  $('stage').innerHTML='<div class="pic">'+item.pic+'</div>'+
    (canSpeak?'<div><button class="say" id="sayb" aria-label="Listen">🔊</button></div>':'<div style="height:20px"></div>')+
    '<div class="row slots" id="slots"></div><div class="row" id="tiles"></div>';
  if(canSpeak) $('sayb').onclick=function(){speak(w)};
  $('slots').onclick=function(e){var b=e.target.closest('[data-s]');if(b)buildRemove(+b.dataset.s)};
  $('tiles').onclick=function(e){var b=e.target.closest('[data-t]');if(b)buildPlace(+b.dataset.t)};
  buildRender();
}
function buildRender(wrong){
  var w=G.items[G.idx].w, n=w.length, mg=isMagic(w);
  $('slots').innerHTML=B.slots.map(function(t,i){
    var c='slot'+(t!==null?' full':'');
    if(B.locked&&!wrong&&mg){if(i===n-1)c+=' e';if(i===n-3)c+=' v'}
    if(wrong&&wrong.indexOf(i)>=0)c+=' wrong';
    return '<button class="'+c+'" data-s="'+i+'">'+(t!==null?B.tiles[t].ch:'')+'</button>';
  }).join('');
  $('tiles').innerHTML=B.tiles.map(function(t,i){
    return '<button class="tile'+(t.used?' used':'')+'" data-t="'+i+'"'+(t.used?' tabindex="-1"':'')+'>'+t.ch+'</button>';
  }).join('');
}
function buildPlace(ti){
  if(B.locked||B.tiles[ti].used)return;
  var s=B.slots.indexOf(null); if(s<0)return;
  B.slots[s]=ti; B.tiles[ti].used=true; buildRender();
  if(B.slots.indexOf(null)<0) buildCheck();
}
function buildRemove(si){
  if(B.locked||B.slots[si]===null)return;
  B.tiles[B.slots[si]].used=false; B.slots[si]=null; buildRender();
}
function buildCheck(){
  var w=G.items[G.idx].w, wrong=[];
  B.slots.forEach(function(t,i){if(B.tiles[t].ch!==w[i])wrong.push(i)});
  B.locked=true;
  if(!wrong.length){
    buildRender(); $('slots').classList.add('ok');
    if(G.results[G.idx]===undefined) G.results[G.idx]=true;
    finishRound(true); speak(w); return;
  }
  G.results[G.idx]=false;
  buildRender(wrong); $('slots').classList.add('shake');
  setTimeout(function(){
    if(G.mode!=='build')return;
    wrong.forEach(function(i){B.tiles[B.slots[i]].used=false;B.slots[i]=null});
    B.locked=false; $('slots').classList.remove('shake'); buildRender();
  },900);
}

/* ---------- mode: listen and choose ---------- */
function roundListen(item){
  var opts=shuffle(item.group.slice());
  $('stage').innerHTML='<button class="say big" id="sayb" aria-label="Listen">🔊</button>'+
    '<div class="opts" id="opts">'+opts.map(function(w){return '<button class="optbtn" data-w="'+w+'">'+w+'</button>'}).join('')+'</div>';
  $('sayb').onclick=function(){speak(item.target)};
  $('opts').onclick=function(e){
    var b=e.target.closest('[data-w]'); if(!b)return;
    var w=b.dataset.w;
    if(G.answered){speak(w);return}
    var right=(w===item.target);
    [].forEach.call($('opts').children,function(o){
      o.innerHTML=colorWord(o.dataset.w);
      if(o.dataset.w===item.target)o.classList.add('right');
      else if(o===b)o.classList.add('wrongpick');
    });
    $('hint').textContent='Нажимай на слова и слушай, чем они отличаются';
    finishRound(right,right?null:'It was: '+item.target);
    if(!right) speak(item.target);
  };
  speak(item.target);
}

/* ---------- mode: missing letter ---------- */
function roundMissing(item){
  var g=item.group, t=item.target, pos=0;
  for(var i=0;i<t.length;i++){if(g[0][i]!==g[1][i]){pos=i;break}}
  var opts=shuffle(g.map(function(w){return {ch:w[pos],w:w}}));
  var boxes=t.split('').map(function(ch,i){
    return i===pos?'<div class="box gap" id="gap"></div>':'<div class="box">'+ch+'</div>';
  }).join('');
  $('stage').innerHTML='<button class="say big" id="sayb" aria-label="Listen">🔊</button>'+
    '<div class="row wordrow" id="wordrow">'+boxes+'</div>'+
    '<div class="opts" id="opts">'+opts.map(function(o){return '<button class="optbtn letter" data-w="'+o.w+'">'+o.ch+'</button>'}).join('')+'</div>';
  $('sayb').onclick=function(){speak(t)};
  $('opts').onclick=function(e){
    var b=e.target.closest('[data-w]'); if(!b)return;
    var w=b.dataset.w;
    if(G.answered){speak(w);return}
    var right=(w===t);
    [].forEach.call($('opts').children,function(o){
      if(o.dataset.w===t)o.classList.add('right'); else if(o===b)o.classList.add('wrongpick');
    });
    $('gap').textContent=t[pos]; $('gap').style.borderStyle='solid';
    if(right)$('wordrow').classList.add('ok'); else $('wordrow').classList.add('shake');
    $('hint').textContent='Нажимай на буквы и слушай, какое слово получится';
    finishRound(right,right?null:'It was: '+t);
    if(!right) speak(t);
  };
  speak(t);
}

/* ---------- mode: read and find ---------- */
function roundFind(item){
  var others=shuffle(WORDS.filter(function(x){return x.w!==item.w})).slice(0,2);
  var opts=shuffle([item].concat(others));
  $('stage').innerHTML='<div class="bigword" id="bigword">'+item.w+'</div>'+
    '<div class="opts" id="opts">'+opts.map(function(o){
      return '<button class="optbtn picopt" data-w="'+o.w+'" aria-label="picture"><div class="pic">'+o.pic+'</div></button>';
    }).join('')+'</div>';
  $('opts').onclick=function(e){
    var b=e.target.closest('[data-w]'); if(!b)return;
    var w=b.dataset.w;
    if(G.answered){speak(w);return}
    var right=(w===item.w);
    [].forEach.call($('opts').children,function(o){
      if(o.dataset.w===item.w)o.classList.add('right'); else if(o===b)o.classList.add('wrongpick');
    });
    $('bigword').innerHTML=colorWord(item.w);
    if(canSpeak)$('hint').textContent='Нажимай на картинки, чтобы услышать слова';
    finishRound(right,right?null:' ');
    speak(item.w);
  };
}

/* ---------- wiring ---------- */
if(!canSpeak){
  $('warn').style.display='block';
  [].forEach.call(document.querySelectorAll('.mode.audio'),function(b){b.disabled=true});
}
document.querySelector('.modes').onclick=function(e){
  var b=e.target.closest('[data-mode]'); if(!b||b.disabled)return;
  var m=b.dataset.mode;
  if(m==='listen'||m==='missing') openSets(m); else startGame(m,null);
};
$('setgrid').onclick=function(e){var b=e.target.closest('[data-set]'); if(b)startGame(G.mode,b.dataset.set)};
$('next').onclick=nextRound;
$('again').onclick=function(){startGame(G.mode,G.set)};
$('tomenu').onclick=function(){show('menu')};
$('home').onclick=function(){try{speechSynthesis.cancel()}catch(e){} G.mode=null; show('menu')};
$('hard').onchange=function(){if(G.mode==='build'&&$('play').classList.contains('on'))startRound()};
document.addEventListener('keydown',function(e){
  if(G.mode!=='build'||!$('play').classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){
    for(var i=B.slots.length-1;i>=0;i--)if(B.slots[i]!==null){buildRemove(i);break}
    return;
  }
  var k=e.key.toLowerCase();
  if(k.length===1&&k>='a'&&k<='z'){
    for(var j=0;j<B.tiles.length;j++)if(!B.tiles[j].used&&B.tiles[j].ch===k){buildPlace(j);break}
  }
});
</script>
</body>
