:root{
  --bg:#F3EEFA; --panel:#FFFDF5; --ink:#1F2A37; --muted:#5C6B7A;
  --tile:#FFD55A; --tile-edge:#D9A514; --slot:#C4BCD2;
  --red:#D1342F; --blue:#2A6FDB; --blue-edge:#1B4C9C; --ok:#2E9E5B; --ok-bg:#DFF5E6; --bad:#D1342F; --bad-bg:#FBE3E1;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:"Andika","Verdana","DejaVu Sans",sans-serif;
  min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 12px 32px}
button{font:inherit; color:inherit}
button:focus-visible{outline:4px solid var(--blue); outline-offset:3px}
.top{width:100%; max-width:780px; display:flex; align-items:center; gap:12px; min-height:48px}
.home{border:0; background:var(--panel); width:48px; height:48px; border-radius:50%; font-size:22px; cursor:pointer; flex:none}
.stars{display:flex; flex-wrap:wrap; gap:3px; font-size:19px; line-height:1; flex:1}
.stars span{opacity:.22; filter:grayscale(1)}
.stars span.on{opacity:1; filter:none}
.stars span.miss{opacity:.55}
.stars span.now{opacity:.6; outline:2px solid var(--blue); border-radius:50%}
.hardopt{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); cursor:pointer; user-select:none}
.hardopt input{width:20px; height:20px; accent-color:var(--blue)}
main{width:100%; max-width:780px; margin-top:12px; background:var(--panel); border-radius:28px; padding:22px 16px 28px; text-align:center}
section{display:none} section.on{display:block}
h1{font-size:28px; font-weight:700; margin:4px 0 4px}
.sub{color:var(--muted); font-size:15px; margin:0 0 16px}
.warn{background:var(--bad-bg); color:var(--bad); border-radius:14px; padding:10px 14px; font-size:14px; margin:12px 0; display:none}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px; text-align:left}
.mode{border:0; background:var(--bg); border-radius:18px; padding:14px; cursor:pointer; display:flex; gap:12px; align-items:center; text-align:left}
.mode .ic{font-size:34px; line-height:1; flex:none}
.mode b{display:block; font-size:17px; font-weight:700}
.mode small{display:block; color:var(--muted); font-size:13px; margin-top:3px; line-height:1.35}

.say{border:0; background:var(--bg); font-size:26px; width:56px; height:56px; border-radius:50%; cursor:pointer; margin:4px 0 16px}
.row{display:flex; justify-content:center; flex-wrap:wrap; gap:10px}
.slot,.tile{width:min(15vw,68px); height:min(17vw,80px); border-radius:14px; font-size:min(9.5vw,44px); display:flex; align-items:center; justify-content:center; padding:0}
.slot{border:3px dashed var(--slot); background:transparent; cursor:pointer}
.slot.full{border-style:solid; border-color:var(--tile-edge); background:var(--tile)}
.slots{margin-bottom:28px; min-height:min(17vw,80px)}
.ok .slot{border-color:var(--ok)!important; background:var(--ok-bg)!important; cursor:default}
.shake{animation:shake .45s}
.slot.wrong{border-color:var(--bad)}
.tile{border:0; background:var(--tile); box-shadow:0 5px 0 var(--tile-edge); cursor:pointer}
.tile:active{transform:translateY(3px); box-shadow:0 2px 0 var(--tile-edge)}
.tile.used{visibility:hidden}
.bigword{font-size:min(14vw,66px); letter-spacing:4px; margin:14px 0 18px; min-height:1.2em}
.bigword.up{color:var(--blue)} .bigword.lo{color:var(--red)}
.bigletter{font-size:min(36vw,150px); line-height:1.1; margin:6px 0 4px}
.bigletter.up{color:var(--blue)} .bigletter.lo{color:var(--red)}

.opts{display:flex; justify-content:center; flex-wrap:wrap; gap:14px}
.optbtn{border:3px solid transparent; background:var(--tile); box-shadow:0 5px 0 var(--tile-edge); border-radius:18px; cursor:pointer;
  min-width:min(36vw,160px); padding:12px 16px; font-size:min(9.5vw,42px); letter-spacing:2px}
.optbtn:active{transform:translateY(3px)}
.optbtn.letter{min-width:0; width:min(21vw,92px); padding:10px 0; letter-spacing:0; font-size:min(12vw,52px)}
.optbtn.right{background:var(--ok-bg)!important; border-color:var(--ok)!important; box-shadow:0 5px 0 var(--ok)!important}
.optbtn.wrongpick{background:var(--bad-bg)!important; border-color:var(--bad)!important; box-shadow:0 5px 0 var(--bad)!important}

.pairs{display:flex; justify-content:center; gap:min(10vw,60px); margin-top:6px}
.pcol{display:flex; flex-direction:column; gap:10px}
.pbtn{border:3px solid var(--slot); background:#fff; border-radius:16px; width:min(26vw,120px); height:min(14vw,66px); font-size:min(9vw,40px); cursor:pointer; box-shadow:0 4px 0 var(--slot)}
.pbtn.up{color:var(--blue)} .pbtn.lo{color:var(--red)}
.pbtn.sel{border-color:var(--tile-edge); background:var(--tile); box-shadow:0 4px 0 var(--tile-edge); color:var(--ink)}
.pbtn.done{border-color:var(--ok); background:var(--ok-bg); box-shadow:none; cursor:default; color:var(--ink)}
.pbtn.bad{border-color:var(--bad); background:var(--bad-bg)}

.sent{display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:18px 0 24px}
.wbtn{border:3px solid var(--slot); background:#fff; border-radius:14px; padding:8px 14px; font-size:min(8.5vw,38px); cursor:pointer; box-shadow:0 4px 0 var(--slot)}
.wbtn.cap{border-color:var(--tile-edge); background:var(--tile); box-shadow:0 4px 0 var(--tile-edge)}
.wbtn.cap::first-letter{color:var(--blue)}
.wbtn.good{border-color:var(--ok); background:var(--ok-bg); box-shadow:none}
.wbtn.badw{border-color:var(--bad); background:var(--bad-bg); box-shadow:none}
.check{border:0; border-radius:18px; background:var(--ok); color:#fff; font-size:22px; font-weight:700; padding:14px 40px; cursor:pointer}

.hint{color:var(--muted); font-size:14px; margin-top:16px; min-height:20px}
.msg{min-height:34px; margin-top:14px; font-size:24px; font-weight:700; color:var(--ok)}
.msg.no{color:var(--bad)}
.next{margin-top:8px; border:0; border-radius:18px; background:var(--blue); color:#fff; font-size:22px; font-weight:700; padding:14px 40px; cursor:pointer; visibility:hidden}
.next.show{visibility:visible}
.endbig{font-size:80px}
.score{font-size:40px; font-weight:700; margin:6px 0 20px}
.endbtns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
.endbtns .next{visibility:visible}
.endbtns .ghost{background:var(--bg); color:var(--ink)}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>
<body>
<div class="top">
  <button class="home" id="home" title="Меню" aria-label="Menu" style="visibility:hidden">🏠</button>
  <div class="stars" id="stars"></div>
  <label class="hardopt" id="hardwrap" style="display:none"><input type="checkbox" id="hard"> Лишние буквы</label>
</div>

<main>
  <section id="menu" class="on">
    <h1>Big and small letters</h1>
    <p class="sub">Aa Bb Cc: большие и маленькие буквы. Выбери игру</p>
    <div class="warn" id="warn">Браузер не умеет озвучивать буквы, игры работают без звука.</div>
    <div class="modes" id="menulist"></div>
  </section>

  <section id="play">
    <div id="stage"></div>
    <div class="hint" id="hint"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <button class="next" id="next">Next</button>
  </section>

  <section id="end">
    <div class="endbig">🏆</div>
    <h1>Well done!</h1>
    <div class="score" id="score"></div>
    <div class="endbtns">
      <button class="next" id="again">Еще раз</button>
      <button class="next ghost" id="tomenu">Меню</button>
    </div>
  </section>
</main>

<script>
/* ================= data ================= */
var ALPHA='abcdefghijklmnopqrstuvwxyz';
var HARD='abdefghijklmnqrty';              /* big and small look different */
var LOOK={a:'eod',b:'dph',c:'eos',d:'bpq',e:'aco',f:'tlr',g:'qpy',h:'nbk',i:'ljt',j:'igy',k:'hxl',l:'itj',m:'nwu',n:'mhu',o:'cae',p:'qbd',q:'pgd',r:'nft',s:'zcg',t:'fli',u:'nvw',v:'wuy',w:'mvu',x:'kyz',y:'gvj',z:'sxn'};
var WORD_SETS=[
  ['kite',['kit','kite','kate']],['bike',['bake','bite','bike']],['game',['game','gate','name']],['home',['hope','home','hole']],
  ['dog',['dog','bog','dig']],['bed',['bad','deb','bed']],['pin',['pin','pen','nip']],['five',['fine','five','fire']],
  ['cake',['cake','cape','coke']],['nine',['mine','nine','nice']],['hat',['hat','hot','hut']],['man',['man','men','mad']],
  ['lake',['lake','like','late']],['rope',['rope','ripe','robe']],['bus',['bus','bug','sub']],['duck',['duck','dock','luck']]
];
var REWRITE=['cat','dog','big','red','hat','ten','cake','bike','home','game','name','kite','five','duck','sun','pig'];
var SENTS=['Mike has a bike.','Kate and I like cake.','The dog is big.','Jane has nine grapes.','I like my cat.','Tom and Sam play a game.','My name is Ben.','The cat is on the bed.','Ann has a red hat.','We like the lake.','I am ten.','Dad and I ride bikes.'];
var ROUNDS=10;
var PRAISE=['Yes!','Great!','Super!','Well done!'];

/* ================= helpers ================= */
var $=function(id){return document.getElementById(id)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a,n){return shuffle(a.slice()).slice(0,n)}
function pickLetters(n){
  var easy=ALPHA.split('').filter(function(c){return HARD.indexOf(c)<0});
  return shuffle(pick(HARD.split(''),Math.min(n,7)).concat(pick(easy,n-Math.min(n,7))));
}
function cap(w){return w[0].toUpperCase()+w.slice(1)}

var canSpeak=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');
var voice=null;
function pickVoice(){
  try{
    var vs=speechSynthesis.getVoices()||[],best=null,score=-1;
    vs.forEach(function(v){
      if(!/^en/i.test(v.lang))return;
      var s=1;
      if(/en[-_]US/i.test(v.lang))s+=2;else if(/en[-_]GB/i.test(v.lang))s+=1;
      if(/google|samantha|natural|aria|jenny/i.test(v.name))s+=2;
      if(s>score){score=s;best=v}
    });
    voice=best;
  }catch(e){}
}
if(canSpeak){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function speak(w){
  if(!canSpeak||!w)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(w);
    u.lang=voice?voice.lang:'en-US';if(voice)u.voice=voice;u.rate=0.75;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* letter names: say the capital so the synthesizer reads a name, not a word ("a" vs "A") */
function sayLetter(ch){speak(ch.toUpperCase())}

/* ================= state ================= */
var G={game:null,items:[],idx:0,results:[],answered:false,scoreText:null};
function show(id){
  ['menu','play','end'].forEach(function(s){$(s).classList.toggle('on',s===id)});
  $('home').style.visibility=(id==='menu')?'hidden':'visible';
  $('hardwrap').style.display=(id==='play'&&G.game&&G.game.eng==='build')?'flex':'none';
  if(id!=='play'&&id!=='end')$('stars').innerHTML='';
}
function drawStars(){
  var h='';
  for(var i=0;i<G.items.length;i++){
    var c=i<G.idx?(G.results[i]?'on':'miss'):(i===G.idx?'now':'');
    h+='<span class="'+c+'">⭐</span>';
  }
  $('stars').innerHTML=h;
}
function finishRound(right,msg){
  G.answered=true;
  if(G.results[G.idx]===undefined)G.results[G.idx]=right;
  $('msg').className='msg'+(right?'':' no');
  $('msg').textContent=msg||(right?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'');
  $('next').classList.add('show');
  if(right)$('next').focus();
}
function nextRound(){
  G.idx++;
  if(G.idx>=G.items.length){
    drawStars();
    var r=G.results.filter(Boolean).length;
    $('score').textContent=G.scoreText||(r+' / '+G.items.length);
    show('end');return;
  }
  startRound();
}
function startRound(){
  G.answered=false;
  $('msg').textContent='';$('msg').className='msg';$('hint').textContent='';
  $('next').classList.remove('show');
  drawStars();
  ({build:roundBuild,choose:roundChoose,pairs:roundPairs,caps:roundCaps})[G.game.eng](G.items[G.idx]);
}
function startGame(game){
  G.game=game;G.idx=0;G.results=[];G.scoreText=null;
  G.items=game.items();
  show('play');startRound();
}

/* ================= engine: build ================= */
var B={slots:[],tiles:[],locked:false};
function roundBuild(item){
  var w=item.w,letters=w.split('');
  if($('hard').checked){
    var pool=shuffle(ALPHA.split('').filter(function(c){return w.toLowerCase().indexOf(c)<0}));
    letters=letters.concat(pool.slice(0,2).map(function(c){return item.upper?c.toUpperCase():c}));
  }
  do{shuffle(letters)}while(letters.slice(0,w.length).join('')===w);
  B.tiles=letters.map(function(c){return{ch:c,used:false}});
  B.slots=w.split('').map(function(){return null});
  B.locked=false;
  var h='<div class="bigword '+(item.upper?'lo':'up')+'">'+item.show+'</div>';
  if(canSpeak)h+='<div><button class="say" id="sayb" aria-label="Listen">🔊</button></div>';
  h+='<div class="row slots" id="slots"></div><div class="row" id="tiles"></div>';
  $('stage').innerHTML=h;
  $('hint').textContent=item.upper?'Напиши это слово большими буквами':'Напиши это слово маленькими буквами';
  if(canSpeak)$('sayb').onclick=function(){speak(w)};
  $('slots').onclick=function(e){var b=e.target.closest('[data-s]');if(b)buildRemove(+b.dataset.s)};
  $('tiles').onclick=function(e){var b=e.target.closest('[data-t]');if(b)buildPlace(+b.dataset.t)};
  buildRender();
}
function buildRender(wrong){
  $('slots').innerHTML=B.slots.map(function(t,i){
    var c='slot'+(t!==null?' full':'');
    if(wrong&&wrong.indexOf(i)>=0)c+=' wrong';
    return '<button class="'+c+'" data-s="'+i+'">'+(t!==null?B.tiles[t].ch:'')+'</button>';
  }).join('');
  $('tiles').innerHTML=B.tiles.map(function(t,i){
    return '<button class="tile'+(t.used?' used':'')+'" data-t="'+i+'"'+(t.used?' tabindex="-1"':'')+'>'+t.ch+'</button>';
  }).join('');
}
function buildPlace(ti){
  if(B.locked||B.tiles[ti].used)return;
  var s=B.slots.indexOf(null);if(s<0)return;
  B.slots[s]=ti;B.tiles[ti].used=true;buildRender();
  if(B.slots.indexOf(null)<0)buildCheck();
}
function buildRemove(si){
  if(B.locked||B.slots[si]===null)return;
  B.tiles[B.slots[si]].used=false;B.slots[si]=null;buildRender();
}
function buildCheck(){
  var w=G.items[G.idx].w,wrong=[];
  B.slots.forEach(function(t,i){if(B.tiles[t].ch!==w[i])wrong.push(i)});
  B.locked=true;
  if(!wrong.length){
    buildRender();$('slots').classList.add('ok');
    if(G.results[G.idx]===undefined)G.results[G.idx]=true;
    finishRound(true);speak(w);return;
  }
  G.results[G.idx]=false;
  buildRender(wrong);$('slots').classList.add('shake');
  setTimeout(function(){
    if(!G.game||G.game.eng!=='build')return;
    wrong.forEach(function(i){B.tiles[B.slots[i]].used=false;B.slots[i]=null});
    B.locked=false;$('slots').classList.remove('shake');buildRender();
  },900);
}

/* ================= engine: choose ================= */
function roundChoose(item){
  var h=item.top||'';
  if(canSpeak&&item.say)h+='<div><button class="say" id="sayb" aria-label="Listen">🔊</button></div>';
  h+='<div class="opts" id="opts">'+item.opts.map(function(o,i){
    return '<button class="optbtn '+(o.cls||'')+'" data-i="'+i+'">'+o.h+'</button>';
  }).join('')+'</div>';
  $('stage').innerHTML=h;
  if(item.hint)$('hint').textContent=item.hint;
  if($('sayb'))$('sayb').onclick=function(){item.say()};
  $('opts').onclick=function(e){
    var b=e.target.closest('[data-i]');if(!b)return;
    var o=item.opts[+b.dataset.i];
    if(G.answered){if(o.say)o.say();return}
    var right=(o.key===item.ans);
    [].forEach.call($('opts').children,function(el,i){
      var oo=item.opts[i];
      if(oo.key===item.ans)el.classList.add('right');else if(el===b)el.classList.add('wrongpick');
    });
    if(item.hintAfter)$('hint').textContent=item.hintAfter;
    finishRound(right,right?null:(item.wrongMsg||' '));
    if(item.after)item.after();
  };
  if(item.say)item.say();
}

/* ================= engine: pairs ================= */
function roundPairs(item){
  var L=item.letters,R=shuffle(L.slice()),sel=null,mist=0,done=0,locked=false;
  $('stage').innerHTML='<div class="pairs"><div class="pcol" id="lcol">'+L.map(function(c,i){return '<button class="pbtn up" data-l="'+i+'">'+c.toUpperCase()+'</button>'}).join('')+
    '</div><div class="pcol" id="rcol">'+R.map(function(c,i){return '<button class="pbtn lo" data-r="'+i+'">'+c+'</button>'}).join('')+'</div></div>';
  $('hint').textContent='Нажми большую букву, потом ее маленькую пару';
  var lc=$('lcol').children,rc=$('rcol').children;
  $('stage').onclick=function(e){
    var b=e.target.closest('.pbtn');if(!b||locked||b.classList.contains('done')||G.answered)return;
    if(b.dataset.l!==undefined){
      if(sel!==null)lc[sel].classList.remove('sel');
      sel=+b.dataset.l;b.classList.add('sel');sayLetter(L[sel]);return;
    }
    if(sel===null)return;
    var r=+b.dataset.r;
    if(R[r]===L[sel]){
      lc[sel].classList.remove('sel');lc[sel].classList.add('done');b.classList.add('done');
      sel=null;done++;
      if(done===L.length){
        if(G.results[G.idx]===undefined)G.results[G.idx]=(mist===0);
        finishRound(mist===0,mist?'Ошибок: '+mist:null);
      }
    }else{
      mist++;G.results[G.idx]=false;locked=true;
      b.classList.add('bad');lc[sel].classList.add('bad');
      var s=sel;
      setTimeout(function(){b.classList.remove('bad');lc[s].classList.remove('bad','sel');sel=null;locked=false},700);
    }
  };
}

/* ================= engine: fix the sentence ================= */
function roundCaps(item){
  var words=item.s.split(' '),state=words.map(function(){return false});
  function render(){
    $('sent').innerHTML=words.map(function(w,i){
      var low=w.toLowerCase();
      return '<button class="wbtn'+(state[i]?' cap':'')+'" data-i="'+i+'">'+(state[i]?cap(low):low)+'</button>';
    }).join('');
  }
  $('stage').innerHTML='<div class="sent" id="sent"></div><button class="check" id="check">Check</button>';
  $('hint').textContent='Нажми на слова, которые надо писать с большой буквы';
  render();
  $('sent').onclick=function(e){var b=e.target.closest('[data-i]');if(!b||G.answered)return;var i=+b.dataset.i;state[i]=!state[i];render()};
  $('check').onclick=function(){
    if(G.answered)return;
    var right=true;
    [].forEach.call($('sent').children,function(el,i){
      var need=(words[i][0]===words[i][0].toUpperCase());
      el.textContent=words[i];
      if(need===state[i])el.classList.add('good');else{el.classList.add('badw');right=false}
      el.classList.remove('cap');
    });
    $('check').style.display='none';
    $('hint').textContent='Большая буква: имя, слово I и начало предложения';
    finishRound(right);speak(item.s);
  };
}

/* ================= item builders ================= */
function letterItems(toLower){return function(){
  return pickLetters(ROUNDS).map(function(c){
    var opts=shuffle([c].concat(LOOK[c].split('')));
    return{
      top:'<div class="bigletter '+(toLower?'up':'lo')+'">'+(toLower?c.toUpperCase():c)+'</div>',
      say:function(){sayLetter(c)},ans:c,
      opts:opts.map(function(o){return{h:toLower?o:o.toUpperCase(),key:o,cls:'letter',say:function(){sayLetter(o)}}}),
      hint:toLower?'Найди маленькую букву':'Найди большую букву',hintAfter:'Нажимай на буквы и слушай их названия',
      wrongMsg:'It was: '+c.toUpperCase()+' '+c
    };
  });
}}
function pairItems(){return [1,2,3].map(function(){return{letters:pickLetters(6)}})}
function wordItems(){
  return pick(WORD_SETS,ROUNDS).map(function(ws){
    var w=ws[0],up=Math.random()<0.5;
    return{
      top:'<div class="bigword '+(up?'lo':'up')+'">'+(up?w:w.toUpperCase())+'</div>',
      say:function(){speak(w)},ans:w,
      opts:shuffle(ws[1].slice()).map(function(o){return{h:up?o.toUpperCase():o,key:o,say:function(){speak(o)}}}),
      hint:'Найди такое же слово',hintAfter:'Нажимай на слова и слушай',wrongMsg:'It was: '+w
    };
  });
}
function rewriteItems(){
  return pick(REWRITE,ROUNDS).map(function(w){
    var upper=Math.random()<0.5;
    return{w:upper?w.toUpperCase():w,show:upper?w:w.toUpperCase(),upper:upper};
  });
}
function capsItems(){return pick(SENTS,8).map(function(s){return{s:s}})}

var GAMES=[
  {id:'small',ic:'🔡',t:'Find the small letter',s:'Видишь большую букву - найди ее маленькую пару: B -> b',eng:'choose',items:letterItems(true)},
  {id:'big',ic:'🔠',t:'Find the big letter',s:'Наоборот: маленькая буква дана, найди большую: d -> D',eng:'choose',items:letterItems(false)},
  {id:'pairs',ic:'🔗',t:'Match the pairs',s:'Соедини большие и маленькие буквы, 3 раунда по 6 пар',eng:'pairs',items:pairItems},
  {id:'word',ic:'🔍',t:'Find the same word',s:'KITE: kit, kite или kate? И наоборот',eng:'choose',items:wordItems},
  {id:'rewrite',ic:'🧩',t:'Rewrite the word',s:'CAKE -> cake, dog -> DOG: собери слово из букв другого размера',eng:'build',items:rewriteItems},
  {id:'caps',ic:'✏️',t:'Fix the sentence',s:'mike has a bike. Где нужна большая буква?',eng:'caps',items:capsItems}
];

/* ================= wiring ================= */
$('menulist').innerHTML=GAMES.map(function(g){
  return '<button class="mode" data-id="'+g.id+'"><span class="ic">'+g.ic+'</span><span><b>'+g.t+'</b><small>'+g.s+'</small></span></button>';
}).join('');
if(!canSpeak)$('warn').style.display='block';
$('menulist').onclick=function(e){
  var b=e.target.closest('[data-id]');if(!b)return;
  startGame(GAMES.filter(function(x){return x.id===b.dataset.id})[0]);
};
$('next').onclick=nextRound;
$('again').onclick=function(){startGame(G.game)};
$('tomenu').onclick=function(){show('menu')};
$('home').onclick=function(){try{speechSynthesis.cancel()}catch(e){}G.game=null;show('menu')};
$('hard').onchange=function(){if(G.game&&G.game.eng==='build'&&$('play').classList.contains('on'))startRound()};
document.addEventListener('keydown',function(e){
  if(!G.game||G.game.eng!=='build'||!$('play').classList.contains('on')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){for(var i=B.slots.length-1;i>=0;i--)if(B.slots[i]!==null){buildRemove(i);break}return}
  var k=e.key;
  if(k.length===1&&/[a-z]/i.test(k)){
    var want=G.items[G.idx].upper?k.toUpperCase():k.toLowerCase();
    for(var j=0;j<B.tiles.length;j++)if(!B.tiles[j].used&&B.tiles[j].ch===want){buildPlace(j);break}
  }
});
</script>
</body>
</html>
